<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keitaro Campaign Manager</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/base/jquery-ui.min.css">
  <link rel="stylesheet" href="/static/app.css?v=7">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/new">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Campaign Manager</span>
        <span class="brand-sub">для Keitaro</span>
      </a>
      <span id="conn" class="conn" hidden></span>
    </header>

    <aside class="sidebar" aria-label="Кампании">
      <a class="btn btn-primary btn-block" href="#/new" id="nav-new"></a>
      <label class="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="campaign-search" type="search" placeholder="Поиск по названию, ID, алиасу" autocomplete="off">
      </label>
      <div class="segmented scope" id="scope" role="group" aria-label="Какие кампании показывать" hidden>
        <button type="button" data-scope="mine">Мои</button><button type="button" data-scope="all">Все</button>
      </div>
      <div class="side-head">
        <span>Кампании в Keitaro</span>
        <button class="icon-btn" id="reload-campaigns" type="button" title="Обновить список" aria-label="Обновить список"></button>
      </div>
      <ul id="campaign-list" class="campaign-list"></ul>
    </aside>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="dialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3 class="dialog-title"></h3>
      <p class="dialog-text"></p>
      <label class="dialog-field" hidden><span class="field-label"></span><input class="input" name="value" autocomplete="off"></label>
      <div class="dialog-actions">
        <button class="btn" value="cancel" type="submit">Отмена</button>
        <button class="btn btn-primary" value="ok" type="submit">OK</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
  <script src="/static/countries.js?v=7"></script>
  <script src="/static/app.js?v=7"></script>
</body>
</html>
